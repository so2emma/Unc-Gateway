server:
  port: 8080

spring:
  application:
    name: gateway-core
  r2dbc:
    url: r2dbc:postgresql://${R2DBC_HOST:postgres}:${R2DBC_PORT:5432}/${R2DBC_DATABASE:unc_db}
    username: ${R2DBC_USER:postgres}
    password: ${R2DBC_PASSWORD:postgrespassword}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20

upstream:
  base-url: http://mock-upstream:9090
  route-prefix: /proxy

gateway:
  listener:
    enabled: true
    channels:
      - services_changed
      - routes_changed
      - plugin_configs_changed
    reconnect:
      initial-delay: 500ms
      max-delay: 30s
      max-attempts: -1

