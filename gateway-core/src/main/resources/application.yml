server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-core
  r2dbc:
    url: r2dbc:postgresql://${R2DBC_HOST:postgres}:${R2DBC_PORT:5432}/${R2DBC_DATABASE:unc_db}
    username: ${R2DBC_USER:postgres}
    password: ${R2DBC_PASSWORD:postgrespassword}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}

upstream:
  base-url: http://mock-upstream:9090
  route-prefix: /proxy

gateway:
  tls:
    server:
      enabled: ${GATEWAY_TLS_SERVER_ENABLED:false}
      keystore-path: ${GATEWAY_TLS_SERVER_KEYSTORE_PATH:}
      keystore-password: ${GATEWAY_TLS_SERVER_KEYSTORE_PASSWORD:changeit}
      keystore-type: ${GATEWAY_TLS_SERVER_KEYSTORE_TYPE:PKCS12}
      client-auth: ${GATEWAY_TLS_SERVER_CLIENT_AUTH:none}
      truststore-path: ${GATEWAY_TLS_SERVER_TRUSTSTORE_PATH:}
      truststore-password: ${GATEWAY_TLS_SERVER_TRUSTSTORE_PASSWORD:changeit}
    client:
      keystore-path: ${GATEWAY_TLS_CLIENT_KEYSTORE_PATH:}
      keystore-password: ${GATEWAY_TLS_CLIENT_KEYSTORE_PASSWORD:changeit}
      keystore-type: ${GATEWAY_TLS_CLIENT_KEYSTORE_TYPE:PKCS12}
      truststore-path: ${GATEWAY_TLS_CLIENT_TRUSTSTORE_PATH:}
      truststore-password: ${GATEWAY_TLS_CLIENT_TRUSTSTORE_PASSWORD:changeit}
      truststore-type: ${GATEWAY_TLS_CLIENT_TRUSTSTORE_TYPE:PKCS12}
  reconciliation:
    interval-ms: 60000
  listener:
    enabled: true
    channels:
      - services_changed
      - routes_changed
      - plugin_configs_changed
    reconnect:
      initial-delay: 500ms
      max-delay: 30s
      max-attempts: -1



