version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: unc-postgres
    environment:
      POSTGRES_DB: unc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unc_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  admin-api:
    build:
      context: .
      dockerfile: admin-api/Dockerfile
    container_name: unc-admin-api
    ports:
      - "8444:8444"
      - "8081:8444"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/unc_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SERVER_PORT: 8444
      SERVER_SSL_BUNDLE: admin-server
      SPRING_SSL_BUNDLE_JKS_ADMIN_SERVER_KEY_ALIAS: admin-api
      SPRING_SSL_BUNDLE_JKS_ADMIN_SERVER_KEYSTORE_LOCATION: file:/pki/certs/admin-api/keystore.p12
      SPRING_SSL_BUNDLE_JKS_ADMIN_SERVER_KEYSTORE_PASSWORD: changeit
      SPRING_SSL_BUNDLE_JKS_ADMIN_SERVER_KEYSTORE_TYPE: PKCS12
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    volumes:
      - ./pki/certs/admin-api:/pki/certs/admin-api:ro
    depends_on:
      postgres:
        condition: service_healthy

  analytics-api:
    build:
      context: .
      dockerfile: analytics-api/Dockerfile
    container_name: unc-analytics-api
    ports:
      - "8445:8445"
      - "8083:8445"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/unc_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgrespassword
      SERVER_PORT: 8445
      SERVER_SSL_BUNDLE: analytics-server
      SPRING_SSL_BUNDLE_JKS_ANALYTICS_SERVER_KEY_ALIAS: analytics-api
      SPRING_SSL_BUNDLE_JKS_ANALYTICS_SERVER_KEYSTORE_LOCATION: file:/pki/certs/analytics-api/keystore.p12
      SPRING_SSL_BUNDLE_JKS_ANALYTICS_SERVER_KEYSTORE_PASSWORD: changeit
      SPRING_SSL_BUNDLE_JKS_ANALYTICS_SERVER_KEYSTORE_TYPE: PKCS12
    volumes:
      - ./pki/certs/analytics-api:/pki/certs/analytics-api:ro
    depends_on:
      postgres:
        condition: service_healthy
      admin-api:
        condition: service_started

  mock-upstream:
    build:
      context: .
      dockerfile: mock-upstream/Dockerfile
    container_name: unc-mock-upstream
    ports:
      - "9090:9090"
      - "8085:9090"
    environment:
      SERVER_PORT: 9090
      SERVER_SSL_BUNDLE: mock-upstream-server
      SPRING_SSL_BUNDLE_JKS_MOCK_UPSTREAM_SERVER_KEY_ALIAS: mock-upstream
      SPRING_SSL_BUNDLE_JKS_MOCK_UPSTREAM_SERVER_KEYSTORE_LOCATION: file:/pki/certs/mock-upstream/keystore.p12
      SPRING_SSL_BUNDLE_JKS_MOCK_UPSTREAM_SERVER_KEYSTORE_PASSWORD: changeit
      SPRING_SSL_BUNDLE_JKS_MOCK_UPSTREAM_SERVER_KEYSTORE_TYPE: PKCS12
    volumes:
      - ./pki/certs/mock-upstream:/pki/certs/mock-upstream:ro

  keycloak:
    image: quay.io/keycloak/keycloak:24
    container_name: unc-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/dev-realm.json:/opt/keycloak/data/import/dev-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: unc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  gateway-core:
    build:
      context: .
      dockerfile: gateway-core/Dockerfile
    container_name: unc-gateway-core
    ports:
      - "8443:8443"
      - "127.0.0.1:8000:8000"
    environment:
      SERVER_PORT: 8443
      GATEWAY_TLS_SERVER_ENABLED: "true"
      GATEWAY_TLS_SERVER_KEYSTORE_PATH: /pki/certs/gateway-core/keystore.p12
      GATEWAY_TLS_SERVER_KEYSTORE_PASSWORD: changeit
      GATEWAY_TLS_SERVER_KEYSTORE_TYPE: PKCS12
      GATEWAY_TLS_CLIENT_KEYSTORE_PATH: /pki/certs/gateway-core/keystore.p12
      GATEWAY_TLS_CLIENT_KEYSTORE_PASSWORD: changeit
      GATEWAY_TLS_CLIENT_KEYSTORE_TYPE: PKCS12
      GATEWAY_TLS_CLIENT_TRUSTSTORE_PATH: /pki/certs/gateway-core/truststore.p12
      GATEWAY_TLS_CLIENT_TRUSTSTORE_PASSWORD: changeit
      GATEWAY_TLS_CLIENT_TRUSTSTORE_TYPE: PKCS12
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/unc_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgrespassword
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      UPSTREAM_BASE_URL: https://mock-upstream:9090
      UPSTREAM_ROUTE_PREFIX: /proxy
    volumes:
      - ./pki/certs/gateway-core:/pki/certs/gateway-core:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-upstream:
        condition: service_started
      keycloak:
        condition: service_started

  developer-portal:
    build:
      context: ./developer-portal
      dockerfile: Dockerfile
    container_name: unc-developer-portal
    ports:
      - "3000:3000"
    environment:
      ADMIN_API_URL: https://admin-api:8444
      NEXT_PUBLIC_ADMIN_API_URL: https://admin-api:8444
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-}
      DEFAULT_ADMIN_API_KEY: ${DEFAULT_ADMIN_API_KEY:-}
    depends_on:
      - admin-api

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: unc-admin-dashboard
    ports:
      - "3001:3000"
    environment:
      ADMIN_API_URL: https://admin-api:8444
      NEXT_PUBLIC_ADMIN_API_URL: https://admin-api:8444
      ANALYTICS_API_URL: https://analytics-api:8445
      NEXT_PUBLIC_ANALYTICS_API_URL: https://analytics-api:8445
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-}
      DEFAULT_ADMIN_API_KEY: ${DEFAULT_ADMIN_API_KEY:-}
    depends_on:
      - admin-api
      - analytics-api

volumes:
  postgres_data:


