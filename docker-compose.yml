version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: unc-postgres
    environment:
      POSTGRES_DB: unc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unc_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  admin-api:
    build:
      context: .
      dockerfile: admin-api/Dockerfile
    container_name: unc-admin-api
    ports:
      - "8082:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/unc_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SERVER_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy

  analytics-api:
    build:
      context: .
      dockerfile: analytics-api/Dockerfile
    container_name: unc-analytics-api
    ports:
      - "8083:8083"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/unc_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgrespassword
      SERVER_PORT: 8083
    depends_on:
      postgres:
        condition: service_healthy
      admin-api:
        condition: service_started

  mock-upstream:
    build:
      context: .
      dockerfile: mock-upstream/Dockerfile
    container_name: unc-mock-upstream
    ports:
      - "9090:9090"
      - "8085:9090"

  redis:
    image: redis:7-alpine
    container_name: unc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  gateway-core:
    build:
      context: .
      dockerfile: gateway-core/Dockerfile
    container_name: unc-gateway-core
    ports:
      - "8080:8080"
    environment:
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/unc_db
      SPRING_R2DBC_USERNAME: postgres
      SPRING_R2DBC_PASSWORD: postgrespassword
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      UPSTREAM_BASE_URL: http://mock-upstream:9090
      UPSTREAM_ROUTE_PREFIX: /proxy
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-upstream:
        condition: service_started

  developer-portal:
    build:
      context: ./developer-portal
      dockerfile: Dockerfile
    container_name: unc-developer-portal
    ports:
      - "3000:3000"
    environment:
      ADMIN_API_URL: http://admin-api:8081
      NEXT_PUBLIC_ADMIN_API_URL: http://admin-api:8081
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-}
      DEFAULT_ADMIN_API_KEY: ${DEFAULT_ADMIN_API_KEY:-}
    depends_on:
      - admin-api

  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    container_name: unc-admin-dashboard
    ports:
      - "3001:3000"
    environment:
      ADMIN_API_URL: http://admin-api:8081
      NEXT_PUBLIC_ADMIN_API_URL: http://admin-api:8081
      ANALYTICS_API_URL: http://analytics-api:8083
      NEXT_PUBLIC_ANALYTICS_API_URL: http://analytics-api:8083
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID:-}
      DEFAULT_ADMIN_API_KEY: ${DEFAULT_ADMIN_API_KEY:-}
    depends_on:
      - admin-api
      - analytics-api

volumes:
  postgres_data:


