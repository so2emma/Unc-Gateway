services:
  postgres:
    image: postgres:16-alpine
    container_name: unc-postgres
    restart: always
    environment:
      POSTGRES_DB: unc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  admin-api:
    build:
      context: .
      dockerfile: admin-api/Dockerfile
    container_name: unc-admin-api
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/unc_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
