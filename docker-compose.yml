services:
  postgres:
    image: postgres:16-alpine
    container_name: unc-postgres
    restart: always
    environment:
      POSTGRES_DB: unc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  admin-api:
    build:
      context: .
      dockerfile: admin-api/Dockerfile
    container_name: unc-admin-api
    restart: always
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/unc_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy

  mock-upstream:
    build:
      context: .
      dockerfile: mock-upstream/Dockerfile
    container_name: unc-mock-upstream
    restart: always
    ports:
      - "9090:9090"
      - "8085:9090"

  gateway-core:
    build:
      context: .
      dockerfile: gateway-core/Dockerfile
    container_name: unc-gateway-core
    restart: always
    ports:
      - "8080:8080"
    environment:
      UPSTREAM_BASE_URL: http://mock-upstream:9090
      UPSTREAM_ROUTE_PREFIX: /proxy
      SERVER_PORT: 8080
    depends_on:
      - mock-upstream

volumes:
  postgres_data:
