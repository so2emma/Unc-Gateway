version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: unc-postgres
    environment:
      POSTGRES_DB: unc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unc_db"]
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  admin-api:
    build:
      context: .
      dockerfile: admin-api/Dockerfile
    container_name: unc-admin-api
    ports:
      - "8082:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/unc_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SERVER_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy

  mock-upstream:
    build:
      context: .
      dockerfile: mock-upstream/Dockerfile
    container_name: unc-mock-upstream
    ports:
      - "9090:9090"
      - "8085:9090"

  gateway-core:
    build:
      context: .
      dockerfile: gateway-core/Dockerfile
    container_name: unc-gateway-core
    ports:
      - "8080:8080"
    environment:
      UPSTREAM_BASE_URL: http://mock-upstream:9090
      UPSTREAM_ROUTE_PREFIX: /proxy
    depends_on:
      - mock-upstream

  developer-portal:
    build:
      context: ./developer-portal
      dockerfile: Dockerfile
    container_name: unc-developer-portal
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_ADMIN_API_URL: http://admin-api:8081
    depends_on:
      - admin-api

volumes:
  postgres_data:

