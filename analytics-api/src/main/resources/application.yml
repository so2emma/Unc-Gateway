server:
  port: ${SERVER_PORT:8083}
  ssl:
    bundle: ${SERVER_SSL_BUNDLE:}

spring:
  application:
    name: analytics-api
  ssl:
    bundle:
      jks:
        analytics-server:
          key:
            alias: ${SPRING_SSL_BUNDLE_JKS_ANALYTICS_SERVER_KEY_ALIAS:analytics-api}
          keystore:
            location: ${SPRING_SSL_BUNDLE_JKS_ANALYTICS_SERVER_KEYSTORE_LOCATION:}
            password: ${SPRING_SSL_BUNDLE_JKS_ANALYTICS_SERVER_KEYSTORE_PASSWORD:changeit}
            type: ${SPRING_SSL_BUNDLE_JKS_ANALYTICS_SERVER_KEYSTORE_TYPE:PKCS12}
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://${R2DBC_HOST:localhost}:${R2DBC_PORT:5432}/${R2DBC_DATABASE:unc_db}}
    username: ${SPRING_R2DBC_USERNAME:${R2DBC_USER:postgres}}
    password: ${SPRING_R2DBC_PASSWORD:${R2DBC_PASSWORD:postgrespassword}}
    pool:
      enabled: true
      initial-size: 5
      max-size: 20

