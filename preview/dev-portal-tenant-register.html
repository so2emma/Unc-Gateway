<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unc — Tenant Registration | Ignite Preview</title>

  .field { margin-bottom: 20px; }
  .cred-panel {
    background: var(--ink); border-radius: var(--radius-control); padding: 18px;
    margin-top: 10px; color: #fff;
  }
  .cred-row { display:flex; justify-content:space-between; align-items:center; padding: 8px 0; }
  .cred-row + .cred-row { border-top: 1px solid rgba(255,255,255,.1); }
  .cred-k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #B6BCC8; }

<body class="theme-light">
<div class="preview-nav">
  <a href="index.html">← All Previews</a>
  <a href="admin-tenants.html">Admin Tenants Grid</a>

<div class="hero-wrap">
  <nav class="nav">
    <div class="container" style="display:flex; align-items:center; justify-content:space-between; height:68px;">

      <a href="#" class="btn btn-outline btn-sm">Sign in</a>

  <div class="stage">

      <span class="pill pill-accent" style="margin-bottom:16px;"><span class="icon" style="width:12px;height:12px;"><svg viewBox="0 0 24 24"><path d="M12 2l1.5 6.5L20 10l-6.5 1.5L12 18l-1.5-6.5L4 10l6.5-1.5z"/></svg></span> Organization setup</span>

      <div class="field">

      <div class="cred-panel">
        <div style="font-size:12px; font-weight:700; color: #FF9A56; margin-bottom:8px; display:flex; align-items:center; gap:6px;"><span class="icon" style="width:13px;height:13px;"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span> TENANT CREATED — SAVE THESE CREDENTIALS</div>
        <div class="cred-row">
          <span class="cred-k">Tenant ID</span>
          <span class="cred-v">t_8f3a1c9d</span>
        </div>
        <div class="cred-row">
          <span class="cred-k">API Key</span>
          <span class="cred-v">unc_live_sec_8f3a1c9d2e4b</span>
